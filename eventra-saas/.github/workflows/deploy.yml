name: 🚀 Deploy IraqGuide to Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '18'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ===== BUILD & TEST =====
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build application
        run: npm run build
        env:
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: build-time-secret-key-for-github-actions
          DATABASE_URL: file:./build.db
          NODE_ENV: production
          
      - name: 🧪 Run tests (if available)
        run: |
          if [ -f "package.json" ] && grep -q '"test"' package.json; then
            npm test
          else
            echo "No tests configured, skipping..."
          fi
        continue-on-error: true
        
      - name: 📊 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-files
          path: .next/
          retention-days: 1

  # ===== DEPLOY TO VERCEL =====
  deploy-vercel:
    name: 🌐 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🚀 Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # ===== DEPLOY TO NETLIFY (Alternative) =====
  deploy-netlify:
    name: 🌐 Deploy to Netlify (Alternative)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'HB-LAPTOP-STORE'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🏗️ Build for Netlify
        run: npm run build
        env:
          NEXTAUTH_URL: https://iraqguide.netlify.app
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          
      - name: 🚀 Deploy to Netlify
        uses: nwtgck/actions-netlify@v2.0
        with:
          publish-dir: './out'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ===== HEALTH CHECK =====
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: [deploy-vercel]
    if: always() && (needs.deploy-vercel.result == 'success')
    
    steps:
      - name: 🔍 Wait for deployment
        run: sleep 60
        
      - name: 🏥 Check application health
        run: |
          HEALTH_URL="${{ secrets.PRODUCTION_URL }}/api/health"
          echo "Checking health at: $HEALTH_URL"
          
          for i in {1..5}; do
            if curl -f -s "$HEALTH_URL"; then
              echo "✅ Health check passed!"
              exit 0
            else
              echo "❌ Health check failed, attempt $i/5"
              sleep 30
            fi
          done
          exit 1
          
      - name: 📊 Verify analytics endpoint
        run: |
          ANALYTICS_URL="${{ secrets.PRODUCTION_URL }}/api/analytics/live"
          echo "Checking analytics at: $ANALYTICS_URL"
          curl -f -s "$ANALYTICS_URL" || echo "⚠️ Analytics endpoint may not be ready yet"

  # ===== NOTIFY =====
  notify:
    name: 📢 Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-vercel, health-check]
    if: always()
    
    steps:
      - name: 📢 Deployment Success
        if: needs.deploy-vercel.result == 'success' && needs.health-check.result == 'success'
        run: |
          echo "🎉 IraqGuide deployed successfully!"
          echo "🌐 Production URL: ${{ secrets.PRODUCTION_URL }}"
          echo "📊 Analytics: ${{ secrets.PRODUCTION_URL }}/admin/analytics"
          
      - name: 📢 Deployment Failed
        if: needs.deploy-vercel.result == 'failure' || needs.health-check.result == 'failure'
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs above for details."
          exit 1