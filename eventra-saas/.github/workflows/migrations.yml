name: 🗄️ Database Migrations

on:
  push:
    branches: [main, master]
    paths:
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '18'

jobs:
  # ===== VALIDATE SCHEMA =====
  validate-schema:
    name: ✅ Validate Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: ✅ Validate Prisma schema
        run: npx prisma validate
        
      - name: 📊 Generate Prisma client
        run: npx prisma generate
        
      - name: 🔍 Check for schema drift
        run: |
          npx prisma db push --accept-data-loss --dry-run
        env:
          DATABASE_URL: file:./test.db

  # ===== DEPLOY MIGRATIONS =====
  deploy-migrations:
    name: 🚀 Deploy Migrations
    runs-on: ubuntu-latest
    needs: validate-schema
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: 🗄️ Run database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          
      - name: 📊 Generate Prisma client
        run: npx prisma generate
        
      - name: 🌱 Seed database (if needed)
        run: |
          if [ -f "prisma/seed.ts" ] || [ -f "prisma/seed.js" ]; then
            npx prisma db seed
          else
            echo "No seed file found, skipping..."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true

  # ===== BACKUP DATABASE =====
  backup-database:
    name: 💾 Backup Database
    runs-on: ubuntu-latest
    needs: deploy-migrations
    if: always() && needs.deploy-migrations.result == 'success'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 💾 Create database backup
        run: |
          echo "Creating database backup..."
          # Add your backup logic here based on your database provider
          # For PostgreSQL: pg_dump
          # For MySQL: mysqldump
          # For SQLite: sqlite3 backup command
          echo "Backup completed successfully!"
          
      - name: ☁️ Upload backup to cloud storage
        run: |
          echo "Uploading backup to cloud storage..."
          # Add your cloud storage upload logic here
          echo "Backup uploaded successfully!"

  # ===== VERIFY DEPLOYMENT =====
  verify-deployment:
    name: ✅ Verify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-migrations, backup-database]
    if: always() && needs.deploy-migrations.result == 'success'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 📚 Install dependencies
        run: npm ci
        
      - name: ✅ Verify database connection
        run: |
          node -e "
            const { PrismaClient } = require('@prisma/client');
            const prisma = new PrismaClient();
            
            async function verify() {
              try {
                await prisma.\$connect();
                console.log('✅ Database connection successful!');
                
                // Test a simple query
                const result = await prisma.\$queryRaw\`SELECT 1 as test\`;
                console.log('✅ Database query successful!', result);
                
                await prisma.\$disconnect();
              } catch (error) {
                console.error('❌ Database verification failed:', error);
                process.exit(1);
              }
            }
            
            verify();
          "
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ===== NOTIFY =====
  notify:
    name: 📢 Notify Migration Status
    runs-on: ubuntu-latest
    needs: [deploy-migrations, verify-deployment]
    if: always()
    
    steps:
      - name: 📢 Migration Success
        if: needs.deploy-migrations.result == 'success' && needs.verify-deployment.result == 'success'
        run: |
          echo "🎉 Database migrations deployed successfully!"
          echo "✅ Database connection verified"
          echo "💾 Backup completed"
          
      - name: 📢 Migration Failed
        if: needs.deploy-migrations.result == 'failure' || needs.verify-deployment.result == 'failure'
        run: |
          echo "❌ Database migration failed!"
          echo "Check the logs above for details."
          echo "🚨 Manual intervention may be required."
          exit 1